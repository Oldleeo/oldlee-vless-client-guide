<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Shadowrocket 导入 VLESS 流程</title>
  <desc id="desc">复制链接、点击加号、从剪贴板添加、选择路由并连接</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#08172d"/><stop offset="1" stop-color="#213352"/></linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#55d6be"/><stop offset="1" stop-color="#c487ff"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#020817" flood-opacity=".45"/></filter>
  </defs>
  <rect width="1200" height="560" rx="24" fill="url(#bg)"/>
  <text x="60" y="70" fill="#f6f9ff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="34" font-weight="800">Shadowrocket 四步连接</text>
  <text x="60" y="105" fill="#a9c3e7" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="17">iPhone / iPad · 先导入，再选择路由</text>
  <path d="M272 290H330M554 290H612M836 290H894" stroke="url(#line)" stroke-width="6" stroke-linecap="round"/>
  <path d="m321 276 18 14-18 14M603 276l18 14-18 14M885 276l18 14-18 14" fill="none" stroke="#c487ff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <g filter="url(#shadow)">
    <rect x="48" y="150" width="224" height="280" rx="18" fill="#132b4b" stroke="#55d6be" stroke-opacity=".75"/>
    <rect x="121" y="180" width="78" height="126" rx="14" fill="#0b1a32" stroke="#7ee6d6" stroke-width="3"/><circle cx="160" cy="289" r="4" fill="#7ee6d6"/>
    <text x="76" y="350" fill="#fff" font-family="sans-serif" font-size="22" font-weight="700">复制链接</text>
    <text x="76" y="382" fill="#abc6e9" font-family="sans-serif" font-size="15">原始单行 vless://</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="330" y="150" width="224" height="280" rx="18" fill="#132b4b" stroke="#64a6ff" stroke-opacity=".75"/>
    <circle cx="442" cy="220" r="42" fill="#315da6"/><text x="442" y="238" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="54" font-weight="300">+</text>
    <text x="358" y="350" fill="#fff" font-family="sans-serif" font-size="22" font-weight="700">点击右上角 +</text>
    <text x="358" y="382" fill="#abc6e9" font-family="sans-serif" font-size="15">Add Server</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="612" y="150" width="224" height="280" rx="18" fill="#132b4b" stroke="#c487ff" stroke-opacity=".75"/>
    <rect x="640" y="192" width="168" height="54" rx="12" fill="#0b1a32" stroke="#d6a8ff"/>
    <text x="724" y="225" text-anchor="middle" fill="#f0dcff" font-family="sans-serif" font-size="15">从剪贴板添加</text>
    <text x="640" y="350" fill="#fff" font-family="sans-serif" font-size="22" font-weight="700">保存并选中</text>
    <text x="640" y="382" fill="#abc6e9" font-family="sans-serif" font-size="15">检查地址和节点名</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="894" y="150" width="258" height="280" rx="18" fill="#132b4b" stroke="#ffcb6b" stroke-opacity=".75"/>
    <circle cx="1023" cy="220" r="43" fill="#117c76"/><path d="M1001 220l15 15 30-34" fill="none" stroke="#dffdf5" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="922" y="350" fill="#fff" font-family="sans-serif" font-size="22" font-weight="700">选择路由并连接</text>
    <text x="922" y="382" fill="#abc6e9" font-family="sans-serif" font-size="15">Proxy 测试，Config 日用</text>
  </g>
  <text x="60" y="505" fill="#8ea8c9" font-family="sans-serif" font-size="15">首次连接需要允许 iOS 添加 VPN 配置</text>
  <text x="1140" y="505" text-anchor="end" fill="#dffdf5" font-family="sans-serif" font-size="15" font-weight="700">老李 Oldlee</text>
</svg>
